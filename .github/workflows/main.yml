name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.6.6"
  NODE_VERSION: "18"
  JAVA_VERSION: "17"
  AWS_REGION: "us-east-1"

# =========================================================
# 1. CHANGE DETECTION
# =========================================================
jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s: ${{ steps.filter.outputs.k8s }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
      services: ${{ steps.filter.outputs.services }}
      services_matrix: ${{ steps.services.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch safely
        run: |
          # Try multiple strategies to get the base branch
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=1 2>/dev/null || \
          git fetch origin ${{ github.base_ref }} --depth=1 2>/dev/null || \
          git fetch origin --depth=1
          
          # Verify branch is available
          if ! git show-ref --verify --quiet refs/remotes/origin/${{ github.base_ref }}; then
            echo "⚠️ Warning: Could not fetch base branch, will use limited comparison"
          fi

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.base_ref }}
          ref: ${{ github.event.pull_request.head.sha }}

          filters: |
            terraform:
              - 'terraform/**'

            k8s:
              - 'k8s/**'

            scripts:
              - 'scripts/**'

            docs:
              - '**/*.md'
              - 'docs/**'
              - 'README.md'

            services:
              - 'services/**'

            api-gateway:
              - 'services/api-gateway/**'

            eureka-server:
              - 'services/eureka-server/**'

            movieService:
              - 'services/movieService/**'

            userService:
              - 'services/userService/**'

            emailService:
              - 'services/emailService/**'

            frontend:
              - 'services/frontend/**'

      - name: Build changed services matrix
        id: services
        run: |
          SERVICES=()

          [[ "${{ steps.filter.outputs.api-gateway }}" == "true" ]] && SERVICES+=("\"api-gateway\"")
          [[ "${{ steps.filter.outputs.eureka-server }}" == "true" ]] && SERVICES+=("\"eureka-server\"")
          [[ "${{ steps.filter.outputs.movieService }}" == "true" ]] && SERVICES+=("\"movieService\"")
          [[ "${{ steps.filter.outputs.userService }}" == "true" ]] && SERVICES+=("\"userService\"")
          [[ "${{ steps.filter.outputs.emailService }}" == "true" ]] && SERVICES+=("\"emailService\"")
          [[ "${{ steps.filter.outputs.frontend }}" == "true" ]] && SERVICES+=("\"frontend\"")

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
          else
            echo "matrix=[$(IFS=,; echo "${SERVICES[*]}")]" >> $GITHUB_OUTPUT
          fi

# =========================================================
# 2. TERRAFORM VALIDATION
# =========================================================
  terraform-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format
        run: terraform fmt -recursive -check terraform/

      - name: Terraform Init + Validate
        run: |
          # Find directories containing .tf files
          find terraform -type f -name "*.tf" -printf "%h\n" | sort -u | while read dir; do
            echo "Validating $dir"

            (
              cd "$dir" || exit 1

              # Initialize with backend disabled for validation
              terraform init -backend=false -input=false
              terraform validate
            )
          done

# =========================================================
# 3. KUBERNETES VALIDATION
# =========================================================
  kubernetes-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.k8s == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch safely
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=1 2>/dev/null || \
          git fetch origin ${{ github.base_ref }} --depth=1 2>/dev/null || \
          git fetch origin --depth=1

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate changed manifests
        run: |
          # Try multiple git diff strategies
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'k8s/**/*.yaml' 2>/dev/null || \
                          git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- 'k8s/**/*.yaml' 2>/dev/null || \
                          echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed YAML files found, skipping validation"
            exit 0
          fi
          
          echo "$CHANGED_FILES"
          FAILED=0
          
          echo "$CHANGED_FILES" | while read file; do
            if [ -f "$file" ]; then
              if ! kubeconform -strict "$file"; then
                FAILED=1
              fi
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            exit 1
          fi

# =========================================================
# 4. SERVICES VALIDATION
# =========================================================
  services-validation:
    needs: detect-changes

    if: |
      needs.detect-changes.outputs.services == 'true' &&
      needs.detect-changes.outputs.services_matrix != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services_matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate service directory
        run: |
          SERVICE_PATH="services/${{ matrix.service }}"
          
          if [ ! -d "$SERVICE_PATH" ]; then
            echo "❌ Service directory not found: $SERVICE_PATH"
            exit 1
          fi
          
          # Validate service configuration
          if [[ "${{ matrix.service }}" == "frontend" ]]; then
            if [ ! -f "$SERVICE_PATH/package.json" ]; then
              echo "❌ package.json not found for frontend service"
              exit 1
            fi
          else
            if [ ! -f "$SERVICE_PATH/pom.xml" ]; then
              echo "❌ pom.xml not found for ${{ matrix.service }}"
              exit 1
            fi
          fi
          
          echo "✅ Service structure validated"

      # -----------------------------------------
      # JAVA
      # -----------------------------------------
      - name: Setup Java
        if: matrix.service != 'frontend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # -----------------------------------------
      # NODE
      # -----------------------------------------
      - name: Setup Node
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      # -----------------------------------------
      # VALIDATE
      # -----------------------------------------
      - name: Build and test service
        run: |
          cd services/${{ matrix.service }}

          if [[ "${{ matrix.service }}" == "frontend" ]]; then
            echo "📦 Installing Node dependencies..."
            npm ci
            
            echo "🏗️ Building frontend..."
            npm run build --if-present
            
            if grep -q '"test"' package.json; then
              echo "🧪 Running tests..."
              npm test --if-present
            else
              echo "ℹ️ No tests defined"
            fi
          else
            echo "📦 Building Java service with Maven..."
            mvn -B clean verify
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}-${{ github.run_id }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/failsafe-reports/
          retention-days: 7

# =========================================================
# 5. SCRIPTS VALIDATION
# =========================================================
  scripts-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch safely
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=1 2>/dev/null || \
          git fetch origin ${{ github.base_ref }} --depth=1 2>/dev/null || \
          git fetch origin --depth=1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3 ansible

      # -----------------------------------------
      # SHELL
      # -----------------------------------------
      - name: Validate Shell Scripts
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'scripts/**/*.sh' 'scripts/**/*.bash' 2>/dev/null || \
                         git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- 'scripts/**/*.sh' 'scripts/**/*.bash' 2>/dev/null || \
                         echo "")
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | while read file; do
              if [ -f "$file" ]; then
                echo "Checking $file"
                shellcheck "$file"
              fi
            done
          else
            echo "No shell scripts changed"
          fi

      # -----------------------------------------
      # PYTHON
      # -----------------------------------------
      - name: Validate Python Scripts
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'scripts/**/*.py' 2>/dev/null || \
                         git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- 'scripts/**/*.py' 2>/dev/null || \
                         echo "")
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | while read file; do
              if [ -f "$file" ]; then
                echo "Checking $file"
                python3 -m py_compile "$file"
              fi
            done
          else
            echo "No Python scripts changed"
          fi

      # -----------------------------------------
      # ANSIBLE
      # -----------------------------------------
      - name: Validate Ansible
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'scripts/ansible/**/*.yml' 'scripts/ansible/**/*.yaml' 2>/dev/null || \
                         git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- 'scripts/ansible/**/*.yml' 'scripts/ansible/**/*.yaml' 2>/dev/null || \
                         echo "")
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | while read file; do
              if [ -f "$file" ]; then
                echo "Checking $file"
                ansible-playbook --syntax-check "$file"
              fi
            done
          else
            echo "No Ansible playbooks changed"
          fi

# =========================================================
# 6. DOCS VALIDATION
# =========================================================
  docs-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch safely
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=1 2>/dev/null || \
          git fetch origin ${{ github.base_ref }} --depth=1 2>/dev/null

      - name: Markdown Link Check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'yes'
          base-branch: ${{ github.base_ref }}
          folder-path: './'
          file-path: './'

      - name: Validate markdown formatting
        run: |
          CHANGED_MD=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.md' 'docs/**/*.md' 'README.md' 2>/dev/null || \
                       git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- '*.md' 'docs/**/*.md' 'README.md' 2>/dev/null || \
                       echo "")
          
          if [ -n "$CHANGED_MD" ]; then
            echo "$CHANGED_MD" | while read file; do
              if [ -f "$file" ]; then
                # Check for common issues
                if grep -E ' \t|  $' "$file" 2>/dev/null; then
                  echo "⚠️ Warning: Trailing whitespace or tabs found in $file"
                fi
              fi
            done
          fi

# =========================================================
# 7. SECURITY SCAN (UNCHANGED - KEPT EXACTLY AS PROVIDED)
# =========================================================
  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -e
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep tag_name | cut -d '"' -f 4)
          curl -L https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: Run Gitleaks Scan
        run: |
          gitleaks detect --source . --redact --verbose --exit-code 1

# =========================================================
# 8. QUALITY GATE
# =========================================================
  quality-gate:
    if: always()

    needs:
      - detect-changes
      - terraform-validation
      - kubernetes-validation
      - services-validation
      - scripts-validation
      - docs-validation
      - secrets-scan

    runs-on: ubuntu-latest

    steps:
      - name: Evaluate all validations
        run: |
          echo "========================================="
          echo "📊 PR VALIDATION SUMMARY"
          echo "========================================="
          echo ""
          
          # Track failures and skipped validations
          FAILED=0
          SKIPPED=0
          
          # Function to check job status
          check_job() {
            local job_name=$1
            local job_result=$2
            local required=$3
            
            if [[ "$required" == "required" ]] || [[ "$job_result" != "skipped" ]]; then
              if [[ "$job_result" == "success" ]]; then
                echo "✅ $job_name: PASSED"
              elif [[ "$job_result" == "failure" ]]; then
                echo "❌ $job_name: FAILED"
                FAILED=1
              elif [[ "$job_result" == "skipped" ]]; then
                echo "⏭️ $job_name: SKIPPED (no changes)"
                SKIPPED=$((SKIPPED + 1))
              else
                echo "⚠️ $job_name: $job_result"
                FAILED=1
              fi
            else
              echo "⏭️ $job_name: SKIPPED"
              SKIPPED=$((SKIPPED + 1))
            fi
          }
          
          # Check each validation job
          check_job "Terraform" "${{ needs.terraform-validation.result }}" "${{ needs.detect-changes.outputs.terraform == 'true' && 'required' || 'optional' }}"
          check_job "Kubernetes" "${{ needs.kubernetes-validation.result }}" "${{ needs.detect-changes.outputs.k8s == 'true' && 'required' || 'optional' }}"
          check_job "Services" "${{ needs.services-validation.result }}" "${{ needs.detect-changes.outputs.services == 'true' && 'required' || 'optional' }}"
          check_job "Scripts" "${{ needs.scripts-validation.result }}" "${{ needs.detect-changes.outputs.scripts == 'true' && 'required' || 'optional' }}"
          check_job "Documentation" "${{ needs.docs-validation.result }}" "${{ needs.detect-changes.outputs.docs == 'true' && 'required' || 'optional' }}"
          check_job "Secrets Scan" "${{ needs.secrets-scan.result }}" "required"
          
          echo ""
          echo "========================================="
          
          if [[ $FAILED -eq 0 ]]; then
            echo "🎉 ALL VALIDATIONS PASSED"
            if [[ $SKIPPED -gt 0 ]]; then
              echo "📈 $SKIPPED validation(s) skipped (no relevant changes)"
            fi
            echo "========================================="
            exit 0
          else
            echo "❌ VALIDATION FAILED - Please fix the errors above"
            echo "========================================="
            exit 1
          fi

      - name: Add PR comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: '❌ **PR Validation Failed**\n\nOne or more validation checks have failed. Please check the workflow logs for details and fix the issues before merging.\n\nView the full workflow run here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
