
name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.6.6"
  NODE_VERSION: "18"
  JAVA_VERSION: "17"
  AWS_REGION: "us-east-1"

# =========================================================
# 1. CHANGE DETECTION
# =========================================================
jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s: ${{ steps.filter.outputs.k8s }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
      services: ${{ steps.filter.outputs.services }}
      services_matrix: ${{ steps.services.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          filters: |
            terraform:
              - 'terraform/**'

            k8s:
              - 'k8s/**'

            scripts:
              - 'scripts/**'

            docs:
              - '**/*.md'
              - 'docs/**'
              - 'README.md'

            services:
              - 'services/**'

            api-gateway:
              - 'services/api-gateway/**'

            eureka-server:
              - 'services/eureka-server/**'

            movieService:
              - 'services/movieService/**'

            userService:
              - 'services/userService/**'

            emailService:
              - 'services/emailService/**'

            frontend:
              - 'services/frontend/**'

      - name: Build changed services matrix
        id: services
        run: |
          SERVICES=()

          [[ "${{ steps.filter.outputs.api-gateway }}" == "true" ]] && SERVICES+=("\"api-gateway\"")
          [[ "${{ steps.filter.outputs.eureka-server }}" == "true" ]] && SERVICES+=("\"eureka-server\"")
          [[ "${{ steps.filter.outputs.movieService }}" == "true" ]] && SERVICES+=("\"movieService\"")
          [[ "${{ steps.filter.outputs.userService }}" == "true" ]] && SERVICES+=("\"userService\"")
          [[ "${{ steps.filter.outputs.emailService }}" == "true" ]] && SERVICES+=("\"emailService\"")
          [[ "${{ steps.filter.outputs.frontend }}" == "true" ]] && SERVICES+=("\"frontend\"")

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
          else
            echo "matrix=[$(IFS=,; echo "${SERVICES[*]}")]" >> $GITHUB_OUTPUT
          fi

# =========================================================
# 2. TERRAFORM VALIDATION
# =========================================================
  terraform-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format
        run: terraform fmt -recursive -check terraform/

      - name: Terraform Init + Validate
        run: |
          find terraform -type f -name "*.tf" | while read file; do
            DIR=$(dirname "$file")

            echo "Validating $DIR"

            (
              cd "$DIR"

              terraform init -backend=false -input=false
              terraform validate
            )
          done

# =========================================================
# 3. KUBERNETES VALIDATION
# =========================================================
  kubernetes-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.k8s == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate changed manifests
        run: |
          CHANGED_FILES=$(git diff --name-only \
            origin/${{ github.base_ref }}...HEAD \
            -- 'k8s/**/*.yaml')

          echo "$CHANGED_FILES"

          echo "$CHANGED_FILES" | while read file; do
            if [ -f "$file" ]; then
              kubeconform -strict "$file"
            fi
          done

# =========================================================
# 4. SERVICES VALIDATION
# =========================================================
  services-validation:
    needs: detect-changes

    if: |
      needs.detect-changes.outputs.services == 'true' &&
      needs.detect-changes.outputs.services_matrix != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services_matrix) }}

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------
      # JAVA
      # -----------------------------------------
      - name: Setup Java
        if: matrix.service != 'frontend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # -----------------------------------------
      # NODE
      # -----------------------------------------
      - name: Setup Node
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      # -----------------------------------------
      # VALIDATE
      # -----------------------------------------
      - name: Build and test service
        run: |
          cd services/${{ matrix.service }}

          if [[ "${{ matrix.service }}" == "frontend" ]]; then
            npm ci
            npm run build --if-present
            npm test --if-present
          else
            mvn -B clean verify
          fi

# =========================================================
# 5. SCRIPTS VALIDATION
# =========================================================
  scripts-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3 ansible

      # -----------------------------------------
      # SHELL
      # -----------------------------------------
      - name: Validate Shell Scripts
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            -- 'scripts/**/*.sh' 'scripts/**/*.bash' \
            | while read file; do

              [ -f "$file" ] && shellcheck "$file"
            done

      # -----------------------------------------
      # PYTHON
      # -----------------------------------------
      - name: Validate Python Scripts
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            -- 'scripts/**/*.py' \
            | while read file; do

              [ -f "$file" ] && python3 -m py_compile "$file"
            done

      # -----------------------------------------
      # ANSIBLE
      # -----------------------------------------
      - name: Validate Ansible
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            -- 'scripts/ansible/**/*.yml' 'scripts/ansible/**/*.yaml' \
            | while read file; do

              [ -f "$file" ] && ansible-playbook --syntax-check "$file"
            done

# =========================================================
# 6. DOCS VALIDATION
# =========================================================
  docs-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Markdown Link Check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'yes'
          base-branch: ${{ github.base_ref }}

# =========================================================
# 7. SECURITY SCAN (UNCHANGED)
# =========================================================
  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -e
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep tag_name | cut -d '"' -f 4)
          curl -L https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: Run Gitleaks Scan
        run: |
          gitleaks detect --source . --redact --verbose --exit-code 1

# =========================================================
# 8. QUALITY GATE
# =========================================================
  quality-gate:
    if: always()

    needs:
      - terraform-validation
      - kubernetes-validation
      - services-validation
      - scripts-validation
      - docs-validation
      - secrets-scan

    runs-on: ubuntu-latest

    steps:
      - name: Evaluate
        run: |
          echo "Validation Summary"

          RESULTS=(
            "${{ needs.terraform-validation.result }}"
            "${{ needs.kubernetes-validation.result }}"
            "${{ needs.services-validation.result }}"
            "${{ needs.scripts-validation.result }}"
            "${{ needs.docs-validation.result }}"
            "${{ needs.secrets-scan.result }}"
          )

          for result in "${RESULTS[@]}"; do
            if [[ "$result" == "failure" ]]; then
              echo "Validation failed"
              exit 1
            fi
          done

          echo "All validations passed"

