name: PR Validation

on:
  pull_request:
    branches: [develop, main, staging]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: '1.6.6'
  KUBERNETES_VERSION: '1.28'
  NODE_VERSION: '18'
  JAVA_VERSION: '17'
  AWS_REGION: 'us-east-1'

jobs:
# --------------------------------
# 1. Detect Changes & Environment
# --------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s: ${{ steps.filter.outputs.k8s }}
      services: ${{ steps.filter.outputs.services }}
      docs: ${{ steps.filter.outputs.docs }}
      scripts: ${{ steps.filter.outputs.scripts }}
      environments: ${{ steps.set-env.outputs.envs }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            terraform: ['terraform/**']
            k8s: ['cinevision-microservices/k8s/**']
            services: ['cinevision-microservices/api-gateway/**', 'cinevision-microservices/eureka-server/**', 'cinevision-microservices/movieService/**', 'cinevision-microservices/userService/**', 'cinevision-microservices/emailService/**', 'cinevision-microservices/frontend/**']
            docs: ['cinevision-microservices/docs/**', 'README.md']
            scripts: ['cinevision-microservices/scripts/**']

      - id: set-env
        run: |
          if [[ "${{ github.base_ref }}" == "develop" ]]; then
            echo 'envs=["dev"]' >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "staging" ]]; then
            echo 'envs=["staging"]' >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "main" ]]; then
            echo 'envs=["prod", "prod-dr"]' >> $GITHUB_OUTPUT
          else
            echo 'envs=["dev"]' >> $GITHUB_OUTPUT
          fi

# --------------------------------
# 2. Terraform Validation
# --------------------------------
  terraform-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env: ${{ fromJson(needs.detect-changes.outputs.environments) }}
      max-parallel: 2

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-${{ matrix.env }}-${{ github.run_id }}

      - name: Terraform Format Check
        run: terraform fmt -recursive -check terraform/

      - name: Terraform Init
        run: |
          set -e
          cd terraform/environments/${{ matrix.env }}
          
          if [[ "${{ matrix.env }}" == "dev" ]] || [[ "${{ matrix.env }}" == "staging" ]]; then
            echo "🔧 Running full initialization for ${{ matrix.env }}"
            terraform init -input=false -reconfigure
          else
            echo "⚡ Running fast validation for ${{ matrix.env }} (backend excluded for security)"
            terraform init -backend=false
          fi

      - name: Terraform Validate
        run: |
          set -e
          cd terraform/environments/${{ matrix.env }}
          terraform validate

      - name: Terraform Plan
        run: |
          set -e
          cd terraform/environments/${{ matrix.env }}
          
          if [[ "${{ matrix.env }}" == "dev" ]] || [[ "${{ matrix.env }}" == "staging" ]]; then
            terraform plan -no-color -input=false -refresh=true -out=tfplan
          else
            terraform plan -no-color -input=false -refresh=false -out=tfplan
          fi

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}-${{ github.run_id }}
          path: terraform/environments/${{ matrix.env }}/tfplan
          retention-days: 7

# --------------------------------
# 3. Kubernetes Validation
# --------------------------------
  kubernetes-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Install kustomize
        run: |
          curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate manifests
        run: |
          set -e
          find cinevision-microservices/k8s -name '*.yaml' -exec kubeconform -strict {} \;

      - name: Kustomize Build Test
        run: |
          set -e
          for env in dev staging prod dr; do
            if [ -d "cinevision-microservices/k8s/overlays/$env" ]; then
              kustomize build cinevision-microservices/k8s/overlays/$env > /dev/null
            fi
          done

# --------------------------------
# 4. Services Validation (Dynamic - Only Existing Services)
# --------------------------------
  services-discovery:
    needs: detect-changes
    if: needs.detect-changes.outputs.services == 'true'
    runs-on: ubuntu-latest
    outputs:
      services_matrix: ${{ steps.discover-services.outputs.matrix }}
      has_services: ${{ steps.discover-services.outputs.has_services }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Discover Available Services
        id: discover-services
        run: |
          # Define all potential services
          ALL_SERVICES=("api-gateway" "eureka-server" "movieService" "userService" "emailService" "frontend")
          
          # Check which services actually exist
          AVAILABLE_SERVICES=()
          
          echo "🔍 Scanning for available services..."
          
          for service in "${ALL_SERVICES[@]}"; do
            if [ -d "cinevision-microservices/$service" ]; then
              # Additional check: at least have a build file
              if [[ "$service" == "frontend" ]]; then
                if [ -f "cinevision-microservices/$service/package.json" ]; then
                  AVAILABLE_SERVICES+=("$service")
                  echo "✅ Found service: $service"
                else
                  echo "⚠️ Directory exists but no package.json: $service"
                fi
              else
                if [ -f "cinevision-microservices/$service/pom.xml" ]; then
                  AVAILABLE_SERVICES+=("$service")
                  echo "✅ Found service: $service"
                else
                  echo "⚠️ Directory exists but no pom.xml: $service"
                fi
              fi
            else
              echo "❌ Service not yet created: $service"
            fi
          done
          
          # Convert to JSON for matrix
          if [ ${#AVAILABLE_SERVICES[@]} -eq 0 ]; then
            echo "No services found to validate"
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_services=false" >> $GITHUB_OUTPUT
          else
            matrix_json=$(printf '%s\n' "${AVAILABLE_SERVICES[@]}" | jq -R . | jq -cs .)
            echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
            echo "has_services=true" >> $GITHUB_OUTPUT
            echo "Found ${#AVAILABLE_SERVICES[@]} services to validate"
          fi
          
      - name: Display Validation Plan
        run: |
          echo "📋 Services to validate: ${{ steps.discover-services.outputs.matrix }}"

  services-validation:
    needs: [detect-changes, services-discovery]
    if: needs.detect-changes.outputs.services == 'true' && needs.services-discovery.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: ${{ fromJson(needs.services-discovery.outputs.services_matrix) }}
      fail-fast: false  # Don't cancel other services if one fails
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        if: matrix.service != 'frontend'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Setup Node
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cinevision-microservices/frontend/package-lock.json
          
      - name: Validate Service Structure
        id: validate-structure
        run: |
          SERVICE_PATH="cinevision-microservices/${{ matrix.service }}"
          
          if [ ! -d "$SERVICE_PATH" ]; then
            echo "❌ Service directory not found: $SERVICE_PATH"
            exit 1
          fi
          
          if [[ "${{ matrix.service }}" == "frontend" ]]; then
            if [ ! -f "$SERVICE_PATH/package.json" ]; then
              echo "❌ package.json not found for frontend service"
              exit 1
            fi
          else
            if [ ! -f "$SERVICE_PATH/pom.xml" ]; then
              echo "❌ pom.xml not found for ${{ matrix.service }}"
              exit 1
            fi
          fi
          
          echo "✅ Service structure validated"
          
      - name: Build & Test Service
        run: |
          set -e
          cd cinevision-microservices/${{ matrix.service }}
          
          echo "🔨 Building and testing ${{ matrix.service }}..."
          
          if [ "${{ matrix.service }}" == "frontend" ]; then
            # Frontend validation
            echo "📦 Installing Node dependencies..."
            npm ci
            
            if grep -q '"test"' package.json; then
              echo "🧪 Running frontend tests..."
              npm run test --if-present
            else
              echo "ℹ️ No tests defined in package.json"
            fi
            
            if grep -q '"build"' package.json; then
              echo "🏗️ Building frontend..."
              npm run build
            else
              echo "ℹ️ No build script defined"
            fi
            
          else
            # Java service validation
            echo "📦 Building with Maven..."
            
            # Check if tests exist
            if [ -d "src/test" ]; then
              echo "🧪 Running tests..."
              mvn -B clean test
            else
              echo "ℹ️ No tests found, running compile only..."
              mvn -B clean compile
            fi
            
            # Verify JAR is created for Spring Boot services
            if grep -q "spring-boot-maven-plugin" pom.xml; then
              echo "📦 Spring Boot service detected, packaging JAR..."
              mvn -B package -DskipTests
            fi
          fi
          
          echo "✅ Service ${{ matrix.service }} validated successfully!"
          
      - name: Run Additional Checks for Java Service
        if: matrix.service != 'frontend' && success()
        run: |
          cd cinevision-microservices/${{ matrix.service }}
          
          echo "🔍 Running additional Java checks..."
          
          # Check for System.out.println in production code (excluding test directories)
          if grep -r --include="*.java" "System\.out\.println" src/main/ 2>/dev/null; then
            echo "⚠️ Warning: System.out.println found in main code. Consider using logger."
          fi
          
          # Check for TODO comments
          if grep -r --include="*.java" "TODO" src/ 2>/dev/null | grep -v "// TODO"; then
            echo "📝 TODO comments found:"
            grep -r --include="*.java" "TODO" src/ | head -5
          fi
          
      - name: Run Additional Checks for Frontend
        if: matrix.service == 'frontend' && success()
        run: |
          cd cinevision-microservices/frontend
          
          echo "🔍 Running additional frontend checks..."
          
          # Check for console.log statements (warn but don't fail)
          if grep -r --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" "console\.log" src/ 2>/dev/null; then
            echo "⚠️ Warning: console.log statements found. Consider removing in production."
          fi
          
          # Run linting if available
          if grep -q '"lint"' package.json; then
            echo "🧹 Running linter..."
            npm run lint --if-present
          fi
          
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}-${{ github.run_id }}
          path: |
            cinevision-microservices/${{ matrix.service }}/target/surefire-reports/
            cinevision-microservices/${{ matrix.service }}/target/site/
            cinevision-microservices/${{ matrix.service }}/coverage/
            cinevision-microservices/${{ matrix.service }}/test-reports/
          retention-days: 7
          
      - name: Upload Build Artifacts (Optional)
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.service }}-${{ github.run_id }}
          path: |
            cinevision-microservices/${{ matrix.service }}/target/*.jar
            cinevision-microservices/${{ matrix.service }}/dist/
            cinevision-microservices/${{ matrix.service }}/build/
          retention-days: 3
          
      - name: Service Validation Failed
        if: failure()
        run: |
          echo "❌ Service ${{ matrix.service }} validation failed!"
          echo "📝 Check the logs above for specific errors"
          echo "💡 Common issues:"
          echo "  - Missing dependencies in pom.xml/package.json"
          echo "  - Compilation errors"
          echo "  - Test failures"
          echo "  - Service directory structure incorrect"

# --------------------------------
# 5. Scripts Validation
# --------------------------------
  scripts-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3 ansible

      - name: Shell lint
        run: |
          if find cinevision-microservices/scripts -name '*.sh' 2>/dev/null | grep -q .; then
            find cinevision-microservices/scripts -name '*.sh' -exec shellcheck {} \;
          else
            echo "No shell scripts found"
          fi

      - name: Python syntax
        run: |
          if find cinevision-microservices/scripts/python -name '*.py' 2>/dev/null | grep -q .; then
            find cinevision-microservices/scripts/python -name '*.py' -exec python3 -m py_compile {} \;
          else
            echo "No Python scripts found"
          fi

      - name: Ansible validation
        run: |
          if ls cinevision-microservices/scripts/ansible/*.yml 1> /dev/null 2>&1; then
            ansible-playbook --syntax-check cinevision-microservices/scripts/ansible/*.yml
          else
            echo "No Ansible playbooks found"
          fi

# --------------------------------
# 6. Documentation Validation
# --------------------------------
  docs-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'yes'
          base-branch: ${{ github.base_ref }}

# --------------------------------
# 7. Security Scan
# --------------------------------
  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Gitleaks (Deterministic)
        run: |
          set -e
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep tag_name | cut -d '"' -f 4)
          curl -L https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: Verify Installation
        run: |
          which gitleaks
          gitleaks version

      - name: Run Gitleaks Scan (Fail on secrets)
        run: |
          gitleaks detect --source . --redact --verbose --exit-code 1

# --------------------------------
# 8. Quality Gate
# --------------------------------
  quality-gate:
    needs: [terraform-validation, kubernetes-validation, services-validation, scripts-validation, docs-validation, secrets-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Results
        run: |
          if [[ "${{ needs.terraform-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.kubernetes-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.services-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.scripts-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.docs-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.secrets-scan.result }}" == "failure" ]]; then
            echo "❌ Validation failed"
            exit 1
          fi
          
          # Also check if services-validation was skipped but services should have been validated
          if [[ "${{ needs.detect-changes.outputs.services }}" == "true" ]] && \
             [[ "${{ needs.services-validation.result }}" == "skipped" ]] && \
             [[ "${{ needs.services-discovery.outputs.has_services }}" == "false" ]]; then
            echo "⚠️ Warning: Services changed but no valid service directories found"
            echo "This might indicate misconfigured service paths"
          fi
          
          echo "🎉 All validations passed!"
