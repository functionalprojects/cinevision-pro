name: PR Validation

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: '1.6.6'
  KUBERNETES_VERSION: '1.28'
  NODE_VERSION: '18'
  JAVA_VERSION: '17'

jobs:

# --------------------------------
# 1. Detect Changes
# --------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s: ${{ steps.filter.outputs.k8s }}
      services: ${{ steps.filter.outputs.services }}
      docs: ${{ steps.filter.outputs.docs }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            terraform: ['terraform/**']
            k8s: ['k8s/**']
            services: ['services/**']
            docs: ['docs/**', 'README.md']
            scripts: ['scripts/**']

# --------------------------------
# 2. Terraform Validation
# --------------------------------
  terraform-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod, prod-dr]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Cache Terraform
        uses: actions/cache@v3
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}

      - name: Format Check
        run: terraform fmt -recursive -check terraform/

      - name: Init
        run: |
          cd terraform/environments/${{ matrix.env }}
          terraform init -backend=false

      - name: Validate
        run: |
          cd terraform/environments/${{ matrix.env }}
          terraform validate

      - name: Plan
        id: plan
        run: |
          cd terraform/environments/${{ matrix.env }}
          terraform plan -out=tfplan -no-color

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: terraform/environments/${{ matrix.env }}/tfplan

# --------------------------------
# 3. Kubernetes Validation
# --------------------------------
  kubernetes-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: find k8s -name '*.yaml' | xargs kubeconform -strict

      - name: Kustomize Build
        run: |
          for env in dev staging prod dr; do
            kustomize build k8s/overlays/$env > /dev/null
          done

# --------------------------------
# 4. Services Validation (Backend + Frontend)
# --------------------------------
  services-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.services == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [api-gateway, eureka-server, movie-service, user-service, email-service, frontend]

    steps:
      - uses: actions/checkout@v4

      # Backend (Java)
      - name: Setup Java
        if: matrix.service != 'frontend'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # Frontend (Node)
      - name: Setup Node
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      # Build & Test
      - name: Build & Test
        run: |
          cd services/${{ matrix.service }}
          if [ "${{ matrix.service }}" == "frontend" ]; then
            npm ci
            npm run test --if-present
            npm run build
          else
            mvn clean test
          fi

      # Upload Reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/site/
            services/${{ matrix.service }}/coverage/
          retention-days: 7

# --------------------------------
# 5. Scripts Validation
# --------------------------------
  scripts-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3 ansible

      - name: Shell scripts lint
        run: find scripts -name '*.sh' -exec shellcheck {} \;

      - name: Python syntax check
        run: find scripts/python -name '*.py' -exec python3 -m py_compile {} \;

      - name: Ansible validation
        run: |
          if ls scripts/ansible/*.yml 1> /dev/null 2>&1; then
            ansible-playbook --syntax-check scripts/ansible/*.yml
          fi

# --------------------------------
# 6. Documentation Validation
# --------------------------------
  docs-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'

      - name: Check documentation freshness
        run: |
          if git diff --name-only HEAD~1 | grep -q "terraform/\|k8s/"; then
            if ! git diff --name-only HEAD~1 | grep -q "docs/"; then
              echo "⚠️ Infra changed but docs not updated"
            fi
          fi

# --------------------------------
# 7. Security Scan (Secrets)
# --------------------------------
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2

# --------------------------------
# 8. Quality Gate
# --------------------------------
  quality-gate:
    needs:
      [
        terraform-validation,
        kubernetes-validation,
        services-validation,
        scripts-validation,
        docs-validation,
        secrets-scan
      ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate Results
        run: |
          for job in ${{ toJson(needs) }}; do
            echo "$job"
          done

          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Validation failed"
            exit 1
          fi

          echo "✅ All validations passed"
