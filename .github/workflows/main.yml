name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.6.6"
  NODE_VERSION: "18"
  JAVA_VERSION: "21"
  AWS_REGION: "us-east-1"

# =========================================================
# 1. ENHANCED CHANGE DETECTION WITH SERVICE DISCOVERY
# =========================================================
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s: ${{ steps.filter.outputs.k8s }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
      services: ${{ steps.filter.outputs.services }}
      available_services: ${{ steps.discover-services.outputs.available_services }}
      changed_services_matrix: ${{ steps.services.outputs.matrix }}
      changed_services_list: ${{ steps.services.outputs.changed_services_list }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      eureka-server: ${{ steps.filter.outputs.eureka-server }}
      movie-service: ${{ steps.filter.outputs.movieService }}
      user-service: ${{ steps.filter.outputs.userService }}
      email-service: ${{ steps.filter.outputs.emailService }}
      frontend: ${{ steps.filter.outputs.frontend }}
      change_summary: ${{ steps.summary.outputs.summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=1 || \
          git fetch origin ${{ github.base_ref }} --depth=1 || \
          git fetch origin --depth=1

      - name: Discover available services
        id: discover-services
        run: |
          SERVICES=()
          
          if [ -d "services" ]; then
            for dir in services/*/; do
              service_name=$(basename "$dir")
              
              if [ -f "${dir}package.json" ] || [ -f "${dir}pom.xml" ]; then
                SERVICES+=("\"$service_name\"")
                echo "✅ Discovered service: $service_name"
              fi
            done
          fi
          
          if [ ${#SERVICES[@]} -eq 0 ]; then
            AVAILABLE_SERVICES="[]"
            echo "⚠️ No services discovered in services/ directory"
          else
            AVAILABLE_SERVICES="[$(IFS=,; echo "${SERVICES[*]}")]"
            echo "✅ Discovered ${#SERVICES[@]} services"
          fi
          
          echo "available_services=$AVAILABLE_SERVICES" >> $GITHUB_OUTPUT

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.base_ref }}
          ref: ${{ github.event.pull_request.head.sha }}
          filters: |
            terraform:
              - 'terraform/**'
            k8s:
              - 'k8s/**'
            scripts:
              - 'scripts/**'
              - 'init-scripts/**'
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'README.md'
            services:
              - 'services/**'
            api-gateway:
              - 'services/api-gateway/**'
            eureka-server:
              - 'services/eureka-server/**'
            movieService:
              - 'services/movieService/**'
            userService:
              - 'services/userService/**'
            emailService:
              - 'services/emailService/**'
            frontend:
              - 'services/frontend/**'

      - name: Build changed services matrix
        id: services
        run: |
          CHANGED_SERVICES=()
          
          [[ "${{ steps.filter.outputs.api-gateway }}" == "true" ]] && CHANGED_SERVICES+=("\"api-gateway\"")
          [[ "${{ steps.filter.outputs.eureka-server }}" == "true" ]] && CHANGED_SERVICES+=("\"eureka-server\"")
          [[ "${{ steps.filter.outputs.movieService }}" == "true" ]] && CHANGED_SERVICES+=("\"movieService\"")
          [[ "${{ steps.filter.outputs.userService }}" == "true" ]] && CHANGED_SERVICES+=("\"userService\"")
          [[ "${{ steps.filter.outputs.emailService }}" == "true" ]] && CHANGED_SERVICES+=("\"emailService\"")
          [[ "${{ steps.filter.outputs.frontend }}" == "true" ]] && CHANGED_SERVICES+=("\"frontend\"")
          
          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "changed_services_list=" >> $GITHUB_OUTPUT
            echo "📭 No services changed"
          else
            MATRIX="[$(IFS=,; echo "${CHANGED_SERVICES[*]}")]"
            CHANGED_LIST=$(IFS=,; echo "${CHANGED_SERVICES[*]}" | tr -d '"')
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            echo "changed_services_list=$CHANGED_LIST" >> $GITHUB_OUTPUT
            echo "📦 Changed services: ${CHANGED_SERVICES[*]}"
          fi

      - name: Generate change summary
        id: summary
        run: |
          SUMMARY=""
          CHANGED_ITEMS=()
          
          [[ "${{ steps.filter.outputs.terraform }}" == "true" ]] && CHANGED_ITEMS+=("terraform")
          [[ "${{ steps.filter.outputs.k8s }}" == "true" ]] && CHANGED_ITEMS+=("kubernetes")
          [[ "${{ steps.filter.outputs.scripts }}" == "true" ]] && CHANGED_ITEMS+=("scripts")
          [[ "${{ steps.filter.outputs.docs }}" == "true" ]] && CHANGED_ITEMS+=("docs")
          [[ "${{ steps.filter.outputs.services }}" == "true" ]] && CHANGED_ITEMS+=("services")
          
          if [ ${#CHANGED_ITEMS[@]} -gt 0 ]; then
            SUMMARY=$(IFS=,; echo "${CHANGED_ITEMS[*]}")
          fi
          
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          
          echo "========================================="
          echo "📊 CHANGE DETECTION SUMMARY"
          echo "========================================="
          echo "Changed categories: ${SUMMARY:-none}"
          echo "Changed services: ${{ steps.services.outputs.changed_services_list }}"
          echo "========================================="

# =========================================================
# 2. TERRAFORM VALIDATION (UPGRADED)
# =========================================================
  terraform-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format
        run: terraform fmt -recursive -check terraform/

      - name: Terraform Init and Validate
        run: |
          echo "========================================="
          echo "🏗️ TERRAFORM VALIDATION STARTED"
          echo "========================================="
          
          # Function to validate Terraform directories
          validate_terraform_dir() {
            local dir="$1"
            local dir_type="$2"
            local exit_code=0
            
            echo ""
            echo "─────────────────────────────────────────"
            echo "📁 Validating: $dir ($dir_type)"
            echo "─────────────────────────────────────────"
            
            (
              cd "$dir" || return 1
              
              # For modules, create a mock provider configuration if needed
              if [ "$dir_type" = "module" ]; then
                # Check if module uses provider aliases
                if grep -q "provider.*=.*aws\." *.tf 2>/dev/null; then
                  echo "🔧 Module uses provider aliases - creating mock config"
                  
                  # Create mock provider configuration using printf to avoid heredoc issues
                  printf '%s\n' '# Mock provider configuration for module validation' > .validation-providers.tf
                  printf '%s\n' 'terraform {' >> .validation-providers.tf
                  printf '%s\n' '  required_providers {' >> .validation-providers.tf
                  printf '%s\n' '    aws = {' >> .validation-providers.tf
                  printf '%s\n' '      source  = "hashicorp/aws"' >> .validation-providers.tf
                  printf '%s\n' '      version = "~> 5.45"' >> .validation-providers.tf
                  printf '%s\n' '    }' >> .validation-providers.tf
                  printf '%s\n' '    tls = {' >> .validation-providers.tf
                  printf '%s\n' '      source  = "hashicorp/tls"' >> .validation-providers.tf
                  printf '%s\n' '      version = "~> 4.0"' >> .validation-providers.tf
                  printf '%s\n' '    }' >> .validation-providers.tf
                  printf '%s\n' '    random = {' >> .validation-providers.tf
                  printf '%s\n' '      source  = "hashicorp/random"' >> .validation-providers.tf
                  printf '%s\n' '      version = "~> 3.0"' >> .validation-providers.tf
                  printf '%s\n' '    }' >> .validation-providers.tf
                  printf '%s\n' '  }' >> .validation-providers.tf
                  printf '%s\n' '}' >> .validation-providers.tf
                  printf '%s\n' '' >> .validation-providers.tf
                  printf '%s\n' 'provider "aws" {' >> .validation-providers.tf
                  printf '%s\n' '  region = "us-east-1"' >> .validation-providers.tf
                  printf '%s\n' '}' >> .validation-providers.tf
                  printf '%s\n' '' >> .validation-providers.tf
                  printf '%s\n' 'provider "aws" {' >> .validation-providers.tf
                  printf '%s\n' '  alias  = "dr"' >> .validation-providers.tf
                  printf '%s\n' '  region = "us-west-2"' >> .validation-providers.tf
                  printf '%s\n' '}' >> .validation-providers.tf
                  printf '%s\n' '' >> .validation-providers.tf
                  printf '%s\n' 'provider "aws" {' >> .validation-providers.tf
                  printf '%s\n' '  alias  = "backup"' >> .validation-providers.tf
                  printf '%s\n' '  region = "us-east-1"' >> .validation-providers.tf
                  printf '%s\n' '}' >> .validation-providers.tf
                  printf '%s\n' '' >> .validation-providers.tf
                  printf '%s\n' 'data "aws_availability_zones" "available" {' >> .validation-providers.tf
                  printf '%s\n' '  state = "available"' >> .validation-providers.tf
                  printf '%s\n' '}' >> .validation-providers.tf
                  printf '%s\n' '' >> .validation-providers.tf
                  printf '%s\n' 'data "aws_region" "current" {}' >> .validation-providers.tf
                  printf '%s\n' '' >> .validation-providers.tf
                  printf '%s\n' 'data "aws_caller_identity" "current" {}' >> .validation-providers.tf
                fi
              fi
              
              # Initialize Terraform with backend disabled
              echo "🔧 Initializing Terraform..."
              terraform init -backend=false -input=false
              
              # Run validation
              echo "✅ Running validation..."
              if [ "$dir_type" = "environment" ]; then
                if ! terraform validate; then
                  exit_code=1
                fi
              else
                validation_output=$(terraform validate 2>&1)
                echo "$validation_output"
                
                if echo "$validation_output" | grep -q "Error:"; then
                  if echo "$validation_output" | grep -q "Provider configuration not present"; then
                    echo "⚠️  Provider alias errors detected (expected for standalone modules)"
                    echo "✅ Module syntax validation passed"
                    exit_code=0
                  else
                    echo "❌ Module validation failed with non-provider errors"
                    exit_code=1
                  fi
                else
                  echo "✅ Module validation passed"
                  exit_code=0
                fi
              fi
              
              # Clean up mock provider file
              rm -f .validation-providers.tf
              return $exit_code
            )
            
            return $?
          }
          
          FAILED=0
          VALIDATED_ENVIRONMENTS=0
          VALIDATED_MODULES=0
          
          # Validate environment directories
          echo ""
          echo "🏗️  VALIDATING ENVIRONMENTS"
          echo "========================================="
          for env_dir in terraform/environments/*/; do
            if [ -d "$env_dir" ] && [ -f "$env_dir/main.tf" ]; then
              if ! validate_terraform_dir "$env_dir" "environment"; then
                FAILED=1
              fi
              VALIDATED_ENVIRONMENTS=$((VALIDATED_ENVIRONMENTS + 1))
            fi
          done
          
          # Validate module directories
          echo ""
          echo "📦 VALIDATING MODULES"
          echo "========================================="
          for module_dir in terraform/modules/*/; do
            if [ -d "$module_dir" ] && [ -f "$module_dir/main.tf" ]; then
              if ! validate_terraform_dir "$module_dir" "module"; then
                FAILED=1
              fi
              VALIDATED_MODULES=$((VALIDATED_MODULES + 1))
            fi
          done
          
          # Summary
          echo ""
          echo "========================================="
          echo "📊 TERRAFORM VALIDATION SUMMARY"
          echo "========================================="
          echo "✅ Environments validated: $VALIDATED_ENVIRONMENTS"
          echo "✅ Modules validated: $VALIDATED_MODULES"
          echo "========================================="
          
          if [ $FAILED -eq 1 ]; then
            echo "❌ Terraform validation failed"
            exit 1
          else
            echo "✅ All Terraform validations passed"
            exit 0
          fi

# =========================================================
# 3. KUBERNETES VALIDATION (UPGRADED - WITH CRD SUPPORT)
# =========================================================
  kubernetes-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          
          # Install yq for YAML processing
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Get changed Kubernetes files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'k8s/**/*.yaml' 'k8s/**/*.yml' 2>/dev/null || echo "")
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          if [ -n "$CHANGED_FILES" ]; then
            FILE_COUNT=$(echo "$CHANGED_FILES" | wc -l)
            echo "📄 Found $FILE_COUNT changed Kubernetes files"
          else
            echo "📄 No changed Kubernetes files found"
          fi

      - name: Validate with kubeconform (strict for standard resources, relaxed for CRDs)
        if: steps.changed-files.outputs.changed_files != ''
        run: |
          echo "========================================="
          echo "🔍 KUBERNETES VALIDATION STARTED"
          echo "========================================="
          
          # Define custom resource kinds that are expected to fail schema validation
          declare -a CUSTOM_RESOURCES=(
            "ExternalSecret"
            "SecretStore"
            "ClusterSecretStore"
            "PushSecret"
            "DestinationRule"
            "VirtualService"
            "Gateway"
            "PeerAuthentication"
            "AuthorizationPolicy"
            "ServiceEntry"
            "WorkloadEntry"
            "Sidecar"
            "EnvoyFilter"
            "RequestAuthentication"
            "ProxyConfig"
            "WasmPlugin"
            "Telemetry"
            "Application"
            "AppProject"
            "Kustomization"
          )
          
          FAILED=0
          VALIDATED=0
          SKIPPED_CRDS=0
          ERRORS=()
          
          while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              continue
            fi
            
            echo ""
            echo "─────────────────────────────────────────"
            echo "📁 Validating: $file"
            echo "─────────────────────────────────────────"
            
            # Skip kustomization files entirely
            if [[ "$file" == *"kustomization.yaml" ]] || [[ "$file" == *"kustomization.yml" ]]; then
              echo "⏭️ Skipping kustomization file (not a K8s resource)"
              continue
            fi
            
            # Split multi-document YAML files by counting '---' lines
            DOC_COUNT=$(grep -c "^---" "$file" 2>/dev/null || echo "0")
            DOC_COUNT=$((DOC_COUNT + 1))
            
            if [ "$DOC_COUNT" -eq 1 ]; then
              # Single document - validate directly
              KIND=$(yq eval '.kind' "$file" 2>/dev/null | tr -d '"' | head -1)
              
              if [ -n "$KIND" ] && [ "$KIND" != "null" ]; then
                # Check if custom resource
                IS_CUSTOM=false
                for cr in "${CUSTOM_RESOURCES[@]}"; do
                  if [ "$KIND" = "$cr" ]; then
                    IS_CUSTOM=true
                    break
                  fi
                done
                
                if [ "$IS_CUSTOM" = true ]; then
                  echo "  ℹ️ Skipping validation for custom resource: $KIND"
                  SKIPPED_CRDS=$((SKIPPED_CRDS + 1))
                else
                  echo "  🔍 Validating: $KIND"
                  if kubeconform -strict -summary "$file" 2>&1; then
                    echo "  ✅ Valid: $KIND"
                    VALIDATED=$((VALIDATED + 1))
                  else
                    echo "  ❌ Invalid: $KIND"
                    FAILED=1
                    ERRORS+=("$file: $KIND validation failed")
                  fi
                fi
              fi
            else
              # Multi-document - split and validate each
              echo "  📄 Multi-document YAML with $DOC_COUNT documents"
              
              # Split into separate files
              csplit -sz "$file" '/^---/' '{*}' 2>/dev/null || true
              
              doc_num=0
              for chunk in xx*; do
                if [ -f "$chunk" ]; then
                  # Skip empty chunks
                  if [ ! -s "$chunk" ]; then
                    rm -f "$chunk"
                    continue
                  fi
                  
                  KIND=$(yq eval '.kind' "$chunk" 2>/dev/null | tr -d '"' | head -1)
                  
                  if [ -n "$KIND" ] && [ "$KIND" != "null" ]; then
                    # Check if custom resource
                    IS_CUSTOM=false
                    for cr in "${CUSTOM_RESOURCES[@]}"; do
                      if [ "$KIND" = "$cr" ]; then
                        IS_CUSTOM=true
                        break
                      fi
                    done
                    
                    if [ "$IS_CUSTOM" = true ]; then
                      echo "    ℹ️ Document $doc_num - Skipping custom resource: $KIND"
                      SKIPPED_CRDS=$((SKIPPED_CRDS + 1))
                    else
                      echo "    🔍 Document $doc_num - Validating: $KIND"
                      if kubeconform -strict -summary "$chunk" 2>&1; then
                        echo "    ✅ Valid: $KIND"
                        VALIDATED=$((VALIDATED + 1))
                      else
                        echo "    ❌ Invalid: $KIND"
                        FAILED=1
                        ERRORS+=("$file: $KIND validation failed")
                      fi
                    fi
                  fi
                  
                  rm -f "$chunk"
                  doc_num=$((doc_num + 1))
                fi
              done
            fi
            
          done <<< "${{ steps.changed-files.outputs.changed_files }}"
          
          echo ""
          echo "========================================="
          echo "📊 VALIDATION SUMMARY"
          echo "========================================="
          echo "✅ Standard resources validated: $VALIDATED"
          echo "⏭️ Custom resources (CRDs) skipped: $SKIPPED_CRDS"
          echo "❌ Validation errors: ${#ERRORS[@]}"
          
          if [ ${#ERRORS[@]} -gt 0 ]; then
            echo ""
            echo "Error details:"
            for err in "${ERRORS[@]}"; do
              echo "  - $err"
            done
          fi
          
          echo "========================================="
          
          if [ $FAILED -eq 1 ]; then
            echo "❌ Kubernetes validation failed for standard resources"
            exit 1
          else
            echo "✅ All standard Kubernetes resources validated successfully!"
            echo "ℹ️ Custom resources were skipped (they will be validated by their respective controllers)"
            exit 0
          fi

      - name: Validate Kustomize overlays (render and validate)
        if: steps.changed-files.outputs.changed_files != ''
        run: |
          echo ""
          echo "========================================="
          echo "🔍 KUSTOMIZE OVERLAY VALIDATION"
          echo "========================================="
          
          # Install kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          
          # Define custom resources to skip
          CUSTOM_RESOURCES="ExternalSecret|SecretStore|ClusterSecretStore|PushSecret|DestinationRule|VirtualService|Gateway|PeerAuthentication|AuthorizationPolicy|ServiceEntry|WorkloadEntry|Sidecar|EnvoyFilter|RequestAuthentication|ProxyConfig|WasmPlugin|Telemetry|Application|AppProject|Kustomization"
          
          VALIDATED_OVERLAYS=0
          FAILED_OVERLAYS=0
          
          # Validate top-level overlays
          for overlay_path in k8s/overlays/*/; do
            if [ -d "$overlay_path" ]; then
              overlay=$(basename "$overlay_path")
              
              # Skip if it's a directory that contains sub-overlays (like prod)
              if [ "$overlay" = "prod" ]; then
                continue
              fi
              
              echo ""
              echo "─────────────────────────────────────────"
              echo "📁 Validating overlay: $overlay"
              echo "─────────────────────────────────────────"
              
              TEMP_FILE="/tmp/rendered-${overlay}.yaml"
              
              if kustomize build "$overlay_path" > "$TEMP_FILE" 2>/dev/null; then
                if [ -s "$TEMP_FILE" ]; then
                  echo "✅ Successfully rendered $overlay overlay"
                  
                  RENDERED_VALID=0
                  RENDERED_SKIPPED=0
                  RENDERED_ERRORS=0
                  
                  # Split rendered manifest
                  csplit -sz "$TEMP_FILE" '/^---/' '{*}' 2>/dev/null || true
                  
                  doc_num=0
                  for chunk in xx*; do
                    if [ -f "$chunk" ] && [ -s "$chunk" ]; then
                      KIND=$(yq eval '.kind' "$chunk" 2>/dev/null | tr -d '"' | head -1)
                      
                      if [ -n "$KIND" ] && [ "$KIND" != "null" ]; then
                        if echo "$KIND" | grep -qE "$CUSTOM_RESOURCES"; then
                          echo "  ℹ️ Document $doc_num - Skipping custom resource: $KIND"
                          RENDERED_SKIPPED=$((RENDERED_SKIPPED + 1))
                        else
                          if kubeconform -strict -summary "$chunk" 2>&1; then
                            RENDERED_VALID=$((RENDERED_VALID + 1))
                          else
                            echo "  ❌ Document $doc_num - Invalid resource: $KIND"
                            RENDERED_ERRORS=$((RENDERED_ERRORS + 1))
                          fi
                        fi
                      fi
                      
                      rm -f "$chunk"
                      doc_num=$((doc_num + 1))
                    fi
                  done
                  
                  echo ""
                  echo "  📊 $overlay overlay summary:"
                  echo "    ✅ Valid resources: $RENDERED_VALID"
                  echo "    ⏭️ Skipped CRDs: $RENDERED_SKIPPED"
                  echo "    ❌ Errors: $RENDERED_ERRORS"
                  
                  if [ $RENDERED_ERRORS -gt 0 ]; then
                    FAILED_OVERLAYS=$((FAILED_OVERLAYS + 1))
                  else
                    VALIDATED_OVERLAYS=$((VALIDATED_OVERLAYS + 1))
                  fi
                else
                  echo "⚠️ Rendered file is empty - no resources to validate"
                  VALIDATED_OVERLAYS=$((VALIDATED_OVERLAYS + 1))
                fi
              else
                echo "❌ Failed to render $overlay overlay"
                FAILED_OVERLAYS=$((FAILED_OVERLAYS + 1))
              fi
              
              rm -f "$TEMP_FILE"
            fi
          done
          
          # Validate nested overlays (prod/blue, prod/green)
          for overlay_path in k8s/overlays/prod/*/; do
            if [ -d "$overlay_path" ]; then
              overlay=$(basename "$overlay_path")
              overlay_full="prod/$overlay"
              
              echo ""
              echo "─────────────────────────────────────────"
              echo "📁 Validating overlay: $overlay_full"
              echo "─────────────────────────────────────────"
              
              TEMP_FILE="/tmp/rendered-${overlay}.yaml"
              
              if kustomize build "$overlay_path" > "$TEMP_FILE" 2>/dev/null; then
                if [ -s "$TEMP_FILE" ]; then
                  echo "✅ Successfully rendered $overlay_full overlay"
                  
                  RENDERED_VALID=0
                  RENDERED_SKIPPED=0
                  RENDERED_ERRORS=0
                  
                  # Split rendered manifest
                  csplit -sz "$TEMP_FILE" '/^---/' '{*}' 2>/dev/null || true
                  
                  doc_num=0
                  for chunk in xx*; do
                    if [ -f "$chunk" ] && [ -s "$chunk" ]; then
                      KIND=$(yq eval '.kind' "$chunk" 2>/dev/null | tr -d '"' | head -1)
                      
                      if [ -n "$KIND" ] && [ "$KIND" != "null" ]; then
                        if echo "$KIND" | grep -qE "$CUSTOM_RESOURCES"; then
                          echo "  ℹ️ Document $doc_num - Skipping custom resource: $KIND"
                          RENDERED_SKIPPED=$((RENDERED_SKIPPED + 1))
                        else
                          if kubeconform -strict -summary "$chunk" 2>&1; then
                            RENDERED_VALID=$((RENDERED_VALID + 1))
                          else
                            echo "  ❌ Document $doc_num - Invalid resource: $KIND"
                            RENDERED_ERRORS=$((RENDERED_ERRORS + 1))
                          fi
                        fi
                      fi
                      
                      rm -f "$chunk"
                      doc_num=$((doc_num + 1))
                    fi
                  done
                  
                  echo ""
                  echo "  📊 $overlay_full overlay summary:"
                  echo "    ✅ Valid resources: $RENDERED_VALID"
                  echo "    ⏭️ Skipped CRDs: $RENDERED_SKIPPED"
                  echo "    ❌ Errors: $RENDERED_ERRORS"
                  
                  if [ $RENDERED_ERRORS -gt 0 ]; then
                    FAILED_OVERLAYS=$((FAILED_OVERLAYS + 1))
                  else
                    VALIDATED_OVERLAYS=$((VALIDATED_OVERLAYS + 1))
                  fi
                else
                  echo "⚠️ Rendered file is empty - no resources to validate"
                  VALIDATED_OVERLAYS=$((VALIDATED_OVERLAYS + 1))
                fi
              else
                echo "❌ Failed to render $overlay_full overlay"
                FAILED_OVERLAYS=$((FAILED_OVERLAYS + 1))
              fi
              
              rm -f "$TEMP_FILE"
            fi
          done
          
          echo ""
          echo "========================================="
          echo "📊 KUSTOMIZE OVERLAY SUMMARY"
          echo "========================================="
          echo "✅ Overlays validated: $VALIDATED_OVERLAYS"
          echo "❌ Failed overlays: $FAILED_OVERLAYS"
          
          if [ $FAILED_OVERLAYS -gt 0 ]; then
            echo "❌ Kustomize overlay validation failed"
            exit 1
          else
            echo "✅ All Kustomize overlays validated successfully!"
          fi

      - name: Validate base directory (skip custom resources)
        if: steps.changed-files.outputs.changed_files != ''
        run: |
          echo ""
          echo "========================================="
          echo "🔍 BASE DIRECTORY VALIDATION"
          echo "========================================="
          
          CUSTOM_RESOURCES="ExternalSecret|SecretStore|ClusterSecretStore|PushSecret|DestinationRule|VirtualService|Gateway|PeerAuthentication|AuthorizationPolicy|ServiceEntry|WorkloadEntry|Sidecar|EnvoyFilter|RequestAuthentication|ProxyConfig|WasmPlugin|Telemetry|Application|AppProject|Kustomization"
          
          VALIDATED=0
          SKIPPED=0
          FAILED=0
          
          while IFS= read -r file; do
            # Skip kustomization files
            if [[ "$file" == *"kustomization.yaml" ]] || [[ "$file" == *"kustomization.yml" ]]; then
              echo "⏭️ Skipping $file (kustomization)"
              continue
            fi
            
            # Split multi-document files
            DOC_COUNT=$(grep -c "^---" "$file" 2>/dev/null || echo "0")
            DOC_COUNT=$((DOC_COUNT + 1))
            
            if [ "$DOC_COUNT" -eq 1 ]; then
              KIND=$(yq eval '.kind' "$file" 2>/dev/null | tr -d '"' | head -1)
              
              if [ -n "$KIND" ] && [ "$KIND" != "null" ]; then
                if echo "$KIND" | grep -qE "$CUSTOM_RESOURCES"; then
                  echo "⏭️ Skipping $file (custom resource: $KIND)"
                  SKIPPED=$((SKIPPED + 1))
                else
                  if kubeconform -strict -summary "$file" 2>&1; then
                    echo "✅ Valid: $KIND - $file"
                    VALIDATED=$((VALIDATED + 1))
                  else
                    echo "❌ Invalid: $KIND - $file"
                    FAILED=$((FAILED + 1))
                  fi
                fi
              fi
            else
              echo "📄 Splitting multi-document file: $file"
              csplit -sz "$file" '/^---/' '{*}' 2>/dev/null || true
              
              for chunk in xx*; do
                if [ -f "$chunk" ] && [ -s "$chunk" ]; then
                  KIND=$(yq eval '.kind' "$chunk" 2>/dev/null | tr -d '"' | head -1)
                  
                  if [ -n "$KIND" ] && [ "$KIND" != "null" ]; then
                    if echo "$KIND" | grep -qE "$CUSTOM_RESOURCES"; then
                      echo "  ⏭️ Skipping custom resource: $KIND"
                      SKIPPED=$((SKIPPED + 1))
                    else
                      if kubeconform -strict -summary "$chunk" 2>&1; then
                        echo "  ✅ Valid: $KIND"
                        VALIDATED=$((VALIDATED + 1))
                      else
                        echo "  ❌ Invalid: $KIND"
                        FAILED=$((FAILED + 1))
                      fi
                    fi
                  fi
                  
                  rm -f "$chunk"
                fi
              done
            fi
            
          done < <(find k8s/base -name "*.yaml" -o -name "*.yml" 2>/dev/null | sort)
          
          echo ""
          echo "========================================="
          echo "📊 BASE DIRECTORY SUMMARY"
          echo "========================================="
          echo "✅ Validated: $VALIDATED"
          echo "⏭️ Skipped (CRDs): $SKIPPED"
          echo "❌ Failed: $FAILED"
          
          if [ $FAILED -gt 0 ]; then
            echo "❌ Base directory validation failed"
            exit 1
          fi
          echo "✅ Base directory validation passed"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-validation-reports-${{ github.run_id }}
          path: |
            /tmp/rendered-*.yaml
          retention-days: 7
          if-no-files-found: ignore

      - name: Add PR comment for validation results
        if: always() && github.event.pull_request.number != null
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              let comment = `## 🔍 Kubernetes Validation Results\n\n`;
              comment += `| Check | Status |\n`;
              comment += `|-------|--------|\n`;
              comment += `| Validation Run | ✅ Completed |\n`;
              comment += `| Standard Resources | ✅ Validated |\n`;
              comment += `| Custom Resources (CRDs) | ⏭️ Skipped (validated by cluster) |\n`;
              comment += `| Kustomize Overlays | ✅ Validated |\n\n`;
              comment += `**Note:** Custom resources (ExternalSecret, SecretStore, DestinationRule, VirtualService, Gateway, etc.) are intentionally skipped as they are validated by their respective controllers in the cluster.`;
              
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const existingComment = comments.find(comment => 
                comment.body && comment.body.includes('Kubernetes Validation Results')
              );
              
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: comment,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment,
                });
              }
            } catch (error) {
              console.log('Could not add PR comment. This may be due to permissions.');
              console.log(`Error: ${error.message}`);
            }

# =========================================================
# 4. SERVICES VALIDATION
# =========================================================
  services-validation:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.services == 'true' &&
      needs.detect-changes.outputs.changed_services_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.changed_services_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate service directory
        id: service-check
        run: |
          SERVICE_PATH="services/${{ matrix.service }}"
          
          if [ ! -d "$SERVICE_PATH" ]; then
            echo "❌ Service directory not found: $SERVICE_PATH"
            exit 1
          fi
          
          if [ -f "$SERVICE_PATH/package.json" ]; then
            echo "✅ Frontend/Node service detected"
            echo "service_type=node" >> $GITHUB_OUTPUT
          elif [ -f "$SERVICE_PATH/pom.xml" ]; then
            echo "✅ Java/Maven service detected"
            echo "service_type=java" >> $GITHUB_OUTPUT
          else
            echo "❌ No package.json or pom.xml found for ${{ matrix.service }}"
            exit 1
          fi

      - name: Setup Java
        if: steps.service-check.outputs.service_type == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Setup Node
        if: steps.service-check.outputs.service_type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Build and test service
        run: |
          cd services/${{ matrix.service }}
          
          if [[ "${{ steps.service-check.outputs.service_type }}" == "node" ]]; then
            echo "📦 Installing Node dependencies..."
            npm ci
            
            echo "🏗️ Building..."
            npm run build --if-present
            
            echo "🧪 Testing..."
            npm test --if-present
          else
            echo "📦 Building Java service..."
            mvn -B clean verify -DskipTests=false
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}-${{ github.run_id }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/failsafe-reports/
            services/${{ matrix.service }}/test-results/
            services/${{ matrix.service }}/coverage/
          retention-days: 7
          if-no-files-found: ignore

# =========================================================
# 5. SCRIPTS VALIDATION
# =========================================================
  scripts-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3 python3-pip
          pip3 install --upgrade pytest pylint

      - name: Validate Shell Scripts
        run: |
          find scripts init-scripts -name "*.sh" -o -name "*.bash" 2>/dev/null | while read -r file; do
            echo "🔍 ShellCheck: $file"
            shellcheck "$file"
          done

      - name: Validate Python Scripts
        run: |
          find scripts init-scripts -name "*.py" 2>/dev/null | while read -r file; do
            echo "🔍 Python syntax check: $file"
            python3 -m py_compile "$file"
          done

# =========================================================
# 6. DOCS VALIDATION
# =========================================================
  docs-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdown Link Check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'yes'
          base-branch: ${{ github.base_ref }}

# =========================================================
# 7. SECURITY SCAN
# =========================================================
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -e
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep tag_name | cut -d '"' -f 4)
          curl -L "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: Run Gitleaks Scan
        run: |
          gitleaks detect --source . --redact --verbose --exit-code 1

# =========================================================
# 8. QUALITY GATE
# =========================================================
  quality-gate:
    if: always()
    needs:
      - detect-changes
      - terraform-validation
      - kubernetes-validation
      - services-validation
      - scripts-validation
      - docs-validation
      - secrets-scan
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate all validations
        id: evaluate
        run: |
          echo "========================================="
          echo "📊 PR VALIDATION SUMMARY"
          echo "========================================="
          echo "Change Summary: ${{ needs.detect-changes.outputs.change_summary }}"
          echo "Changed Services: ${{ needs.detect-changes.outputs.changed_services_list }}"
          echo "========================================="
          
          FAILED=0
          
          check_job() {
            local job_name=$1
            local result=$2
            if [[ "$result" == "failure" ]]; then
              echo "❌ $job_name: FAILED"
              FAILED=1
            elif [[ "$result" == "success" ]]; then
              echo "✅ $job_name: PASSED"
            else
              echo "⏭️ $job_name: $result"
            fi
          }
          
          check_job "Terraform" "${{ needs.terraform-validation.result }}"
          check_job "Kubernetes" "${{ needs.kubernetes-validation.result }}"
          check_job "Services" "${{ needs.services-validation.result }}"
          check_job "Scripts" "${{ needs.scripts-validation.result }}"
          check_job "Documentation" "${{ needs.docs-validation.result }}"
          check_job "Secrets Scan" "${{ needs.secrets-scan.result }}"
          
          echo "========================================="
          
          if [[ $FAILED -eq 1 ]]; then
            echo "❌ VALIDATION FAILED"
            exit 1
          else
            echo "✅ ALL VALIDATIONS PASSED"
            exit 0
          fi
