name: PR Validation

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: '1.6.6'
  KUBERNETES_VERSION: '1.28'
  NODE_VERSION: '18'
  JAVA_VERSION: '17'

jobs:

# --------------------------------
# 1. Detect Changes (Path-based optimization)
# --------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s: ${{ steps.filter.outputs.k8s }}
      services: ${{ steps.filter.outputs.services }}
      docs: ${{ steps.filter.outputs.docs }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            terraform: ['terraform/**']
            k8s: ['k8s/**']
            services: ['services/**']
            docs: ['docs/**', 'README.md']
            scripts: ['scripts/**']

# --------------------------------
# 2. Terraform Validation
# --------------------------------
  terraform-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env: [dev, staging, prod, prod-dr]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -recursive -check terraform/

      - name: Terraform Init
        run: |
          cd terraform/environments/${{ matrix.env }}
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform/environments/${{ matrix.env }}
          terraform validate

      - name: Terraform Plan (Safe Mode)
        run: |
          cd terraform/environments/${{ matrix.env }}
          terraform plan -no-color -input=false

# --------------------------------
# 3. Kubernetes Validation
# --------------------------------
  kubernetes-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Install kustomize
        run: |
          curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate manifests
        run: find k8s -name '*.yaml' | xargs kubeconform -strict

      - name: Kustomize Build Test
        run: |
          for env in dev staging prod dr; do
            kustomize build k8s/overlays/$env > /dev/null
          done

# --------------------------------
# 4. Services Validation (Backend + Frontend)
# --------------------------------
  services-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.services == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [api-gateway, eureka-server, movie-service, user-service, email-service, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        if: matrix.service != 'frontend'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Build & Test
        run: |
          cd services/${{ matrix.service }}
          if [ "${{ matrix.service }}" == "frontend" ]; then
            npm ci
            npm run test --if-present
            npm run build
          else
            mvn clean test
          fi

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/site/
            services/${{ matrix.service }}/coverage/
          retention-days: 7

# --------------------------------
# 5. Scripts Validation
# --------------------------------
  scripts-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3 ansible

      - name: Shell lint
        run: find scripts -name '*.sh' -exec shellcheck {} \;

      - name: Python syntax
        run: find scripts/python -name '*.py' -exec python3 -m py_compile {} \;

      - name: Ansible validation
        run: |
          if ls scripts/ansible/*.yml 1> /dev/null 2>&1; then
            ansible-playbook --syntax-check scripts/ansible/*.yml
          fi

# --------------------------------
# 6. Documentation Validation
# --------------------------------
  docs-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1

# --------------------------------
# 7. Security Scan (FREE Gitleaks CLI)
# --------------------------------
  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Gitleaks (FREE)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Scan
        run: |
          gitleaks detect --source . --redact --verbose

# --------------------------------
# 8. Quality Gate (FIXED)
# --------------------------------
  quality-gate:
    needs:
      [
        terraform-validation,
        kubernetes-validation,
        services-validation,
        scripts-validation,
        docs-validation,
        secrets-scan
      ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate Results (Fixed)
        run: |
          FAILED=0

          check_job () {
            NAME=$1
            STATUS=$2

            if [ "$STATUS" != "success" ] && [ "$STATUS" != "skipped" ]; then
              echo "❌ $NAME failed"
              FAILED=1
            else
              echo "✅ $NAME passed or skipped"
            fi
          }

          check_job "terraform-validation" "${{ needs.terraform-validation.result }}"
          check_job "kubernetes-validation" "${{ needs.kubernetes-validation.result }}"
          check_job "services-validation" "${{ needs.services-validation.result }}"
          check_job "scripts-validation" "${{ needs.scripts-validation.result }}"
          check_job "docs-validation" "${{ needs.docs-validation.result }}"
          check_job "secrets-scan" "${{ needs.secrets-scan.result }}"

          if [ $FAILED -eq 1 ]; then
            echo "❌ Quality gate failed"
            exit 1
          fi

          echo "🎉 All validations passed"
