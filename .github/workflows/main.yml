name: PR Validation

on:
  pull_request:
    branches: [develop, main, staging]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: '1.6.6'
  KUBERNETES_VERSION: '1.28'
  NODE_VERSION: '18'
  JAVA_VERSION: '17'
  AWS_REGION: 'us-east-1'

jobs:
# --------------------------------
# 1. Detect Changes & Environment
# --------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s: ${{ steps.filter.outputs.k8s }}
      services: ${{ steps.filter.outputs.services }}
      docs: ${{ steps.filter.outputs.docs }}
      scripts: ${{ steps.filter.outputs.scripts }}
      environments: ${{ steps.set-env.outputs.envs }}
      changed_services: ${{ steps.filter.outputs.changed_services }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper change detection

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            terraform: ['terraform/**']
            k8s: ['k8s/**']
            services: ['services/**']
            docs: ['docs/**', 'README.md']
            scripts: ['scripts/**']
            
            # Individual service paths for granular change detection
            api-gateway: ['services/api-gateway/**']
            eureka-server: ['services/eureka-server/**']
            movieService: ['services/movieService/**']
            userService: ['services/userService/**']
            emailService: ['services/emailService/**']
            frontend: ['services/frontend/**']

      - id: set-env
        run: |
          if [[ "${{ github.base_ref }}" == "develop" ]]; then
            echo 'envs=["dev"]' >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "staging" ]]; then
            echo 'envs=["staging"]' >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "main" ]]; then
            echo 'envs=["prod", "prod-dr"]' >> $GITHUB_OUTPUT
          else
            echo 'envs=["dev"]' >> $GITHUB_OUTPUT
          fi
      
      - name: Debug - Show changed services
        run: |
          echo "Services directory changed: ${{ steps.filter.outputs.services }}"
          echo "Individual service changes:"
          echo "  api-gateway: ${{ steps.filter.outputs.api-gateway }}"
          echo "  eureka-server: ${{ steps.filter.outputs.eureka-server }}"
          echo "  movieService: ${{ steps.filter.outputs.movieService }}"
          echo "  userService: ${{ steps.filter.outputs.userService }}"
          echo "  emailService: ${{ steps.filter.outputs.emailService }}"
          echo "  frontend: ${{ steps.filter.outputs.frontend }}"

# --------------------------------
# 2. Terraform Validation
# --------------------------------
  terraform-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env: ${{ fromJson(needs.detect-changes.outputs.environments) }}
      max-parallel: 2

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-${{ matrix.env }}-${{ github.run_id }}

      - name: Terraform Format Check
        run: terraform fmt -recursive -check terraform/

      - name: Terraform Init
        run: |
          set -e
          cd terraform/environments/${{ matrix.env }}
          
          if [[ "${{ matrix.env }}" == "dev" ]] || [[ "${{ matrix.env }}" == "staging" ]]; then
            echo "🔧 Running full initialization for ${{ matrix.env }}"
            terraform init -input=false -reconfigure
          else
            echo "⚡ Running fast validation for ${{ matrix.env }} (backend excluded for security)"
            terraform init -backend=false
          fi

      - name: Terraform Validate
        run: |
          set -e
          cd terraform/environments/${{ matrix.env }}
          terraform validate

      - name: Terraform Plan
        run: |
          set -e
          cd terraform/environments/${{ matrix.env }}
          
          if [[ "${{ matrix.env }}" == "dev" ]] || [[ "${{ matrix.env }}" == "staging" ]]; then
            terraform plan -no-color -input=false -refresh=true -out=tfplan
          else
            terraform plan -no-color -input=false -refresh=false -out=tfplan
          fi

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}-${{ github.run_id }}
          path: terraform/environments/${{ matrix.env }}/tfplan
          retention-days: 7

# --------------------------------
# 3. Kubernetes Validation
# --------------------------------
  kubernetes-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Install kustomize
        run: |
          curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate manifests
        run: |
          set -e
          find k8s -name '*.yaml' -exec kubeconform -strict {} \;

      - name: Kustomize Build Test
        run: |
          set -e
          for env in dev staging prod dr; do
            if [ -d "k8s/overlays/$env" ]; then
              kustomize build k8s/overlays/$env > /dev/null
            fi
          done

# --------------------------------
# 4. Services Discovery & Change Detection
# --------------------------------
  services-discovery:
    needs: detect-changes
    if: needs.detect-changes.outputs.services == 'true'
    runs-on: ubuntu-latest
    outputs:
      services_matrix: ${{ steps.discover-services.outputs.matrix }}
      has_services: ${{ steps.discover-services.outputs.has_services }}
      changed_services: ${{ steps.discover-services.outputs.changed_services }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Discover Available Services and Track Changes
        id: discover-services
        run: |
          # Define all potential services
          ALL_SERVICES=("api-gateway" "eureka-server" "movieService" "userService" "emailService" "frontend")
          
          # Track which services have changed
          declare -A services_changed
          
          # Check service changes from detect-changes output
          if [ -n "${{ needs.detect-changes.outputs.api-gateway }}" ]; then
            services_changed["api-gateway"]="${{ needs.detect-changes.outputs.api-gateway }}"
          fi
          if [ -n "${{ needs.detect-changes.outputs.eureka-server }}" ]; then
            services_changed["eureka-server"]="${{ needs.detect-changes.outputs.eureka-server }}"
          fi
          if [ -n "${{ needs.detect-changes.outputs.movieService }}" ]; then
            services_changed["movieService"]="${{ needs.detect-changes.outputs.movieService }}"
          fi
          if [ -n "${{ needs.detect-changes.outputs.userService }}" ]; then
            services_changed["userService"]="${{ needs.detect-changes.outputs.userService }}"
          fi
          if [ -n "${{ needs.detect-changes.outputs.emailService }}" ]; then
            services_changed["emailService"]="${{ needs.detect-changes.outputs.emailService }}"
          fi
          if [ -n "${{ needs.detect-changes.outputs.frontend }}" ]; then
            services_changed["frontend"]="${{ needs.detect-changes.outputs.frontend }}"
          fi
          
          # Discover which services exist AND have changes
          AVAILABLE_SERVICES=()
          CHANGED_SERVICES=()
          
          echo "🔍 Scanning for available services with changes..."
          
          for service in "${ALL_SERVICES[@]}"; do
            # Check if service directory exists
            if [ -d "services/$service" ]; then
              # Verify service has proper build file
              if [[ "$service" == "frontend" ]]; then
                if [ -f "services/$service/package.json" ]; then
                  AVAILABLE_SERVICES+=("$service")
                  # Check if this service changed
                  if [[ "${services_changed[$service]}" == "true" ]]; then
                    CHANGED_SERVICES+=("$service")
                    echo "✅ Service $service exists and HAS CHANGES - will validate"
                  else
                    echo "⏭️ Service $service exists but NO CHANGES - skipping validation"
                  fi
                else
                  echo "⚠️ Directory exists but no package.json: $service"
                fi
              else
                if [ -f "services/$service/pom.xml" ]; then
                  AVAILABLE_SERVICES+=("$service")
                  # Check if this service changed
                  if [[ "${services_changed[$service]}" == "true" ]]; then
                    CHANGED_SERVICES+=("$service")
                    echo "✅ Service $service exists and HAS CHANGES - will validate"
                  else
                    echo "⏭️ Service $service exists but NO CHANGES - skipping validation"
                  fi
                else
                  echo "⚠️ Directory exists but no pom.xml: $service"
                fi
              fi
            else
              echo "❌ Service not yet created: $service"
            fi
          done
          
          # Convert to JSON for matrix (only changed services)
          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            echo "No changed services found to validate"
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_services=false" >> $GITHUB_OUTPUT
            echo "changed_services=[]" >> $GITHUB_OUTPUT
          else
            matrix_json=$(printf '%s\n' "${CHANGED_SERVICES[@]}" | jq -R . | jq -cs .)
            changed_json=$(printf '%s\n' "${CHANGED_SERVICES[@]}" | jq -R . | jq -cs .)
            echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
            echo "has_services=true" >> $GITHUB_OUTPUT
            echo "changed_services=$changed_json" >> $GITHUB_OUTPUT
            echo "Found ${#CHANGED_SERVICES[@]} service(s) with changes to validate: ${CHANGED_SERVICES[*]}"
          fi
          
      - name: Display Validation Plan
        run: |
          echo "📋 Services to validate (changed only): ${{ steps.discover-services.outputs.matrix }}"

# --------------------------------
# 5. Services Validation (Only Changed Services)
# --------------------------------
  services-validation:
    needs: [detect-changes, services-discovery]
    if: needs.detect-changes.outputs.services == 'true' && needs.services-discovery.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: ${{ fromJson(needs.services-discovery.outputs.services_matrix) }}
      fail-fast: false  # Don't cancel other services if one fails
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        if: matrix.service != 'frontend'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Setup Node
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json
          
      - name: Validate Service Structure
        id: validate-structure
        run: |
          SERVICE_PATH="services/${{ matrix.service }}"
          
          if [ ! -d "$SERVICE_PATH" ]; then
            echo "❌ Service directory not found: $SERVICE_PATH"
            exit 1
          fi
          
          if [[ "${{ matrix.service }}" == "frontend" ]]; then
            if [ ! -f "$SERVICE_PATH/package.json" ]; then
              echo "❌ package.json not found for frontend service"
              exit 1
            fi
          else
            if [ ! -f "$SERVICE_PATH/pom.xml" ]; then
              echo "❌ pom.xml not found for ${{ matrix.service }}"
              exit 1
            fi
          fi
          
          echo "✅ Service structure validated"
          
      - name: Determine Changed Files for Context
        id: changed-files
        run: |
          # Get list of changed files for this specific service for better context
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- "services/${{ matrix.service }}/")
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "📝 Changed files in ${{ matrix.service }}:"
            echo "$CHANGED_FILES" | head -20
            echo "changed_files_count=$(echo "$CHANGED_FILES" | wc -l)" >> $GITHUB_OUTPUT
          else
            echo "changed_files_count=0" >> $GITHUB_OUTPUT
          fi
          
      - name: Build & Test Service
        run: |
          set -e
          cd services/${{ matrix.service }}
          
          echo "🔨 Building and testing ${{ matrix.service }}..."
          
          if [ "${{ matrix.service }}" == "frontend" ]; then
            # Frontend validation
            echo "📦 Installing Node dependencies..."
            npm ci
            
            # Run only if package.json has test script
            if grep -q '"test"' package.json; then
              echo "🧪 Running frontend tests..."
              npm run test --if-present
            else
              echo "ℹ️ No tests defined in package.json"
            fi
            
            if grep -q '"build"' package.json; then
              echo "🏗️ Building frontend..."
              npm run build
            else
              echo "ℹ️ No build script defined"
            fi
            
          else
            # Java service validation
            echo "📦 Building with Maven..."
            
            # Check if tests exist
            if [ -d "src/test" ]; then
              echo "🧪 Running tests..."
              mvn -B clean test
            else
              echo "ℹ️ No tests found, running compile only..."
              mvn -B clean compile
            fi
            
            # Verify JAR is created for Spring Boot services
            if grep -q "spring-boot-maven-plugin" pom.xml; then
              echo "📦 Spring Boot service detected, packaging JAR..."
              mvn -B package -DskipTests
            fi
          fi
          
          echo "✅ Service ${{ matrix.service }} validated successfully!"
          
      - name: Run Additional Checks for Java Service
        if: matrix.service != 'frontend' && success()
        run: |
          cd services/${{ matrix.service }}
          
          echo "🔍 Running additional Java checks..."
          
          # Check for System.out.println in production code (excluding test directories)
          if grep -r --include="*.java" "System\.out\.println" src/main/ 2>/dev/null; then
            echo "⚠️ Warning: System.out.println found in main code. Consider using logger."
          fi
          
          # Check for TODO comments
          if grep -r --include="*.java" "TODO" src/ 2>/dev/null | grep -v "// TODO"; then
            echo "📝 TODO comments found:"
            grep -r --include="*.java" "TODO" src/ | head -5
          fi
          
      - name: Run Additional Checks for Frontend
        if: matrix.service == 'frontend' && success()
        run: |
          cd services/frontend
          
          echo "🔍 Running additional frontend checks..."
          
          # Check for console.log statements (warn but don't fail)
          if grep -r --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" "console\.log" src/ 2>/dev/null; then
            echo "⚠️ Warning: console.log statements found. Consider removing in production."
          fi
          
          # Run linting if available
          if grep -q '"lint"' package.json; then
            echo "🧹 Running linter..."
            npm run lint --if-present
          fi
          
          # Check for large dependency changes
          if [ -f "package-lock.json" ]; then
            DEPENDENCY_COUNT=$(jq '.packages | length' package-lock.json 2>/dev/null || echo "unknown")
            echo "📦 Total dependencies: $DEPENDENCY_COUNT"
          fi
          
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}-${{ github.run_id }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/site/
            services/${{ matrix.service }}/coverage/
            services/${{ matrix.service }}/test-reports/
          retention-days: 7
          
      # - name: Upload Build Artifacts (Optional)
      #   if: success() && github.event_name == 'pull_request'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: build-${{ matrix.service }}-${{ github.run_id }}
      #     path: |
      #       services/${{ matrix.service }}/target/*.jar
      #       services/${{ matrix.service }}/dist/
      #       services/${{ matrix.service }}/build/
      #     retention-days: 3
          
      - name: Service Validation Failed
        if: failure()
        run: |
          echo "❌ Service ${{ matrix.service }} validation failed!"
          echo "📝 Check the logs above for specific errors"
          echo "💡 Common issues:"
          echo "  - Missing dependencies in pom.xml/package.json"
          echo "  - Compilation errors"
          echo "  - Test failures"
          echo "  - Service directory structure incorrect"

# --------------------------------
# 6. Scripts Validation
# --------------------------------
  scripts-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3 ansible

      - name: Shell lint
        run: |
          if find scripts -name '*.sh' 2>/dev/null | grep -q .; then
            find scripts -name '*.sh' -exec shellcheck {} \;
          else
            echo "No shell scripts found"
          fi

      - name: Python syntax
        run: |
          if find scripts/python -name '*.py' 2>/dev/null | grep -q .; then
            find scripts/python -name '*.py' -exec python3 -m py_compile {} \;
          else
            echo "No Python scripts found"
          fi

      - name: Ansible validation
        run: |
          if ls scripts/ansible/*.yml 1> /dev/null 2>&1; then
            ansible-playbook --syntax-check scripts/ansible/*.yml
          else
            echo "No Ansible playbooks found"
          fi

# --------------------------------
# 7. Documentation Validation
# --------------------------------
  docs-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'yes'
          base-branch: ${{ github.base_ref }}

# --------------------------------
# 8. Security Scan
# --------------------------------
  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Gitleaks (Deterministic)
        run: |
          set -e
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep tag_name | cut -d '"' -f 4)
          curl -L https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: Verify Installation
        run: |
          which gitleaks
          gitleaks version

      - name: Run Gitleaks Scan (Fail on secrets)
        run: |
          gitleaks detect --source . --redact --verbose --exit-code 1

# --------------------------------
# 9. Quality Gate
# --------------------------------
  quality-gate:
    needs: [terraform-validation, kubernetes-validation, services-validation, scripts-validation, docs-validation, secrets-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Results
        run: |
          FAILED=0
          
          # Check each validation job
          if [[ "${{ needs.terraform-validation.result }}" == "failure" ]]; then
            echo "❌ Terraform validation failed"
            FAILED=1
          fi
          
          if [[ "${{ needs.kubernetes-validation.result }}" == "failure" ]]; then
            echo "❌ Kubernetes validation failed"
            FAILED=1
          fi
          
          if [[ "${{ needs.services-validation.result }}" == "failure" ]]; then
            echo "❌ Services validation failed"
            FAILED=1
          fi
          
          if [[ "${{ needs.scripts-validation.result }}" == "failure" ]]; then
            echo "❌ Scripts validation failed"
            FAILED=1
          fi
          
          if [[ "${{ needs.docs-validation.result }}" == "failure" ]]; then
            echo "❌ Documentation validation failed"
            FAILED=1
          fi
          
          if [[ "${{ needs.secrets-scan.result }}" == "failure" ]]; then
            echo "❌ Secrets scan failed"
            FAILED=1
          fi
          
          # Special check: Services changed but no validation ran
          if [[ "${{ needs.detect-changes.outputs.services }}" == "true" ]] && \
             [[ "${{ needs.services-validation.result }}" == "skipped" ]] && \
             [[ "${{ needs.services-discovery.outputs.has_services }}" == "false" ]]; then
            echo "⚠️ Warning: Services directory changed but no valid service directories found"
            echo "This might indicate misconfigured service paths or missing build files"
            FAILED=1
          fi
          
          # Success message if everything passed or was skipped appropriately
          if [[ $FAILED -eq 0 ]]; then
            echo "🎉 All validations passed!"
            
            # Show summary of what was validated
            echo ""
            echo "📊 Validation Summary:"
            [[ "${{ needs.terraform-validation.result }}" == "success" ]] && echo "  ✅ Terraform: Validated"
            [[ "${{ needs.terraform-validation.result }}" == "skipped" ]] && echo "  ⏭️ Terraform: No changes"
            [[ "${{ needs.kubernetes-validation.result }}" == "success" ]] && echo "  ✅ Kubernetes: Validated"
            [[ "${{ needs.kubernetes-validation.result }}" == "skipped" ]] && echo "  ⏭️ Kubernetes: No changes"
            [[ "${{ needs.services-validation.result }}" == "success" ]] && echo "  ✅ Services: Validated changed services"
            [[ "${{ needs.services-validation.result }}" == "skipped" ]] && echo "  ⏭️ Services: No changes or no services to validate"
            [[ "${{ needs.scripts-validation.result }}" == "success" ]] && echo "  ✅ Scripts: Validated"
            [[ "${{ needs.scripts-validation.result }}" == "skipped" ]] && echo "  ⏭️ Scripts: No changes"
            [[ "${{ needs.docs-validation.result }}" == "success" ]] && echo "  ✅ Documentation: Validated"
            [[ "${{ needs.docs-validation.result }}" == "skipped" ]] && echo "  ⏭️ Documentation: No changes"
            [[ "${{ needs.secrets-scan.result }}" == "success" ]] && echo "  ✅ Secrets Scan: No secrets detected"
          else
            exit 1
          fi
