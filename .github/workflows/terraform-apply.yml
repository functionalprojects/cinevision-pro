name: Terraform Apply

on:
  push:
    branches: [develop, staging, main]
    paths: ['terraform/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to target'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
          - prod-dr

env:
  TERRAFORM_VERSION: '1.6.6'
  AWS_REGION: 'us-east-1'

jobs:
# --------------------------------
# 1. Setup Logic
# --------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.mapping.outputs.env }}
    steps:
      - id: mapping
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            if [[ "${{ github.ref_name }}" == "develop" ]]; then
              echo 'env=dev' >> $GITHUB_OUTPUT
            elif [[ "${{ github.ref_name }}" == "staging" ]]; then
              echo 'env=staging' >> $GITHUB_OUTPUT
            elif [[ "${{ github.ref_name }}" == "main" ]]; then
              echo 'env=prod' >> $GITHUB_OUTPUT
            fi
          fi

# --------------------------------
# 2. Terraform Apply
# --------------------------------
  terraform-apply:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env }}
    
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd terraform/environments/${{ needs.setup.outputs.env }}
          terraform init -input=false -reconfigure

      - name: Terraform Apply
        run: |
          cd terraform/environments/${{ needs.setup.outputs.env }}
          terraform apply -auto-approve -input=false

      - name: Terraform Apply Summary
        if: always()
        run: |
          echo "## Terraform Apply Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.setup.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

# --------------------------------
# 3. Handle Production DR Apply
# --------------------------------
  terraform-apply-dr:
    needs: setup
    if: needs.setup.outputs.env == 'prod'
    runs-on: ubuntu-latest
    environment: prod-dr
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Terraform Init
        run: |
          cd terraform/environments/prod-dr
          terraform init -input=false -reconfigure
          
      - name: Terraform Apply
        run: |
          cd terraform/environments/prod-dr
          terraform apply -auto-approve -input=false
          
      - name: Terraform Apply DR Summary
        if: always()
        run: |
          echo "## Terraform Apply DR Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** prod-dr" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
