server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: user-service
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME:cinevision_user_app}:${MONGO_PASSWORD:user_app_password_change_me}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:user}?authSource=${MONGO_AUTH_SOURCE:user}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:${ZIPKIN_PORT:9411}/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:password}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  expiration-days: ${JWT_EXPIRATION_DAYS:14}
