server.port=${SERVER_PORT:8082}
spring.data.mongodb.uri=mongodb://${MONGO_USERNAME:cinevision_user_app}:${MONGO_PASSWORD:user_app_password_change_me}@${MONGO_HOST:mongodb}:${MONGO_PORT:27017}/${MONGO_DATABASE:user}?authSource=${MONGO_AUTH_SOURCE:user}
spring.data.mongodb.auto-index-creation=true
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration-days=${JWT_EXPIRATION_DAYS:14}
management.zipkin.tracing.endpoint=http://${ZIPKIN_HOST:zipkin}:${ZIPKIN_PORT:9411}/api/v2/spans
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:password}@${EUREKA_HOST:eureka-server}:${EUREKA_PORT:8761}/eureka/
