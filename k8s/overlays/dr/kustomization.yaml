apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cinevision-prod-dr
resources:
  - ../../base
  - ingress.yaml
images:
  - name: api-gateway
    newName: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/cinevision/api-gateway
    newTag: dr-latest
  - name: user-service
    newName: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/cinevision/user-service
    newTag: dr-latest
  - name: movie-service
    newName: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/cinevision/movie-service
    newTag: dr-latest
  - name: email-service
    newName: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/cinevision/email-service
    newTag: dr-latest
  - name: eureka-server
    newName: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/cinevision/eureka-server
    newTag: dr-latest
replicas:
  - name: api-gateway
    count: 1
  - name: user-service
    count: 1
  - name: movie-service
    count: 1
  - name: email-service
    count: 1
patches:
  - path: configmap-patch.yaml
  - path: externalsecret-patch.yaml
  - target:
      group: external-secrets.io
      version: v1beta1
      kind: ClusterSecretStore
      name: cinevision-secret-store
    patch: |-
      - op: replace
        path: /spec/provider/aws/auth/jwt/serviceAccountRef/namespace
        value: cinevision-prod-dr
