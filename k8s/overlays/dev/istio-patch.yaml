apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: cinevision-gateway
spec:
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "dev.DOMAIN_NAME"
    - "api.dev.DOMAIN_NAME"
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "dev.DOMAIN_NAME"
    - "api.dev.DOMAIN_NAME"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cinevision-vs
spec:
  hosts:
  - "dev.DOMAIN_NAME"
  - "api.dev.DOMAIN_NAME"
