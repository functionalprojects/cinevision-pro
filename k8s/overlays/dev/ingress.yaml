apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinevision-dev
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: dev.cinevisionca.link
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
