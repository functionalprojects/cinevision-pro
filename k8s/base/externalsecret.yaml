apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cinevision-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secretsmanager
  target:
    name: cinevision-app-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: /cinevision/dev/application-secrets
